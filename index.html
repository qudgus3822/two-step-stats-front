<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>투스텝 스탯 · 농구 기록 대시보드</title>
    <!-- [신설: 2026-09-02 13:15, 김병현 작성] 첫 페인트 전에 다크 여부를 정한다.
         React 가 뜨기 전이라 여기서 안 하면 다크 사용자가 흰 화면을 한 번 본다(FOUC).
         규칙은 ThemeContext.initialMode() 와 글자 그대로 같아야 한다 — 저장값 > OS > 라이트. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tss-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', m === 'dark');
          document.documentElement.dataset.theme = m; /* Phase 5 에서 이 줄만 지운다 */
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
